name: ROS 2 CI (argus_inference)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    container:
      image: rostooling/setup-ros-docker:ubuntu-jammy-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test argus_inference
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: argus_inference
          target-ros2-distro: humble
          vcs-repo-file-url: ${{ github.workspace }}/argus_inference.repos
          colcon-defaults: |
            {
              "build": {
                "symlink-install": true
              }
            }

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      - name: Build the docs (ROS absent, imports mocked)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
